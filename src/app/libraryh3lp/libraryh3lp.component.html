<div class="lh3-chat-widget" [style.bottom]="iconPosition || null">
  <header aria-labelled-by="lh3-chat-button" class="lh3-chat-header">
    @if (hoverTooltip) {
      <div class="lh3-chat-tooltip" [innerHTML]="tooltipContent"></div>
      <div class="lh3-chat-tooltip-arrow" aria-label="hidden"></div>
    }
    @if (!showChat) {
      <button id="lh3-chat-button" class="lh3-chat-button" (click)="chatOnline ? toggleChatTab($event) : openOfflineLink($event)" (mouseover)="mouseOverChatTab()" (mouseout)="mouseOutChatTab()" (touchend)="chatOnline ? toggleChatTab($event) : openOfflineLink($event)" [attr.aria-label]="chatOnline ? 'Open chat' : 'Open help link'" [ngStyle]="{'height': iconSize || null, 'background-color': tabColor(), 'border-color': tabColor()}">
        <span class="lh3-chat-label">{{ chatOnline ? 'Click to chat' : 'Contact us' }}</span>
        <img class="lh3-tab-icon" src="assets/icons/askon_small_chat_bubble_white.png" alt="chat bubble" aria-hidden="true" />
      </button>
    }
  </header>
  <div class="lh3-chat-frame-wrap" cdkDrag [hidden]="!showChat">
    <div class="lh3-close-chat-bar" [ngStyle]="{'background-color': tabColor()}">
      <button type="button" class="lh3-close-chat" [ngStyle]="{'background-color': tabColor()}" (click)="toggleChatTab($event)" (touchend)="toggleChatTab($event)" aria-label="Close chat">&times;</button>
    </div>
    <div class="needs-js"></div>
  </div>
</div>
